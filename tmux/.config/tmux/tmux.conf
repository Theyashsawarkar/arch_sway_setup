# ==============================================================================
# TMUX ARCHITECTURE - WAYLAND / KITTY / VIM OPTIMIZED
# ==============================================================================

# ------------------------------------------------------------------------------
# CORE BEHAVIOR
# ------------------------------------------------------------------------------
# Set True Color support specifically for Kitty
set-option -sa terminal-overrides ",xterm-kitty:Tc"
set -g default-terminal "tmux-256color"

# Change prefix from Ctrl-B to Ctrl-Space (Much faster for the left hand)
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Remove escape delay (CRITICAL for Neovim)
set -sg escape-time 0

# Enable mouse support for resizing and scrolling
set -g mouse on

# Start windows and panes at index 1 (0 is too far on the keyboard)
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# ------------------------------------------------------------------------------
# VIM INTEGRATION & NAVIGATION
# ------------------------------------------------------------------------------
# Use Vim keys in copy mode
set-window-option -g mode-keys vi

# Pane switching with hjkl
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Split panes using | and - (Opens in current directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Reload config instantly with prefix + r
bind r source-file ~/.config/tmux/tmux.conf \; display "Tmux Config Reloaded!"

# ------------------------------------------------------------------------------
# WAYLAND CLIPBOARD INTEGRATION
# ------------------------------------------------------------------------------
# Map 'v' to begin selection and 'y' to yank to Wayland clipboard
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"

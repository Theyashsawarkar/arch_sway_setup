########## GENERAL ##########
set -g mouse on
set -g history-limit 200000          # Bigger buffer for long logs
set -g default-terminal "tmux-256color"

# WAYLAND & KITTY SPECIFIC: Modern terminal overrides (fix colors)
set-option -sa terminal-overrides ",xterm-kitty:Tc"

set -g status-keys vi
setw -g mode-keys vi

# CRITICAL FOR NEOVIM: Zero delay for escape key press
set -sg escape-time 0

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

########## PREFIX ##########
unbind C-b
set -g prefix C-a
bind C-a send-prefix

########## SPLITS ##########
# Open splits in the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

########## NAVIGATION ##########
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

bind -n M-S-Left resize-pane -L 5
bind -n M-S-Right resize-pane -R 5
bind -n M-S-Up resize-pane -U 2
bind -n M-S-Down resize-pane -D 2

bind -n C-S-1 select-window -t 1
bind -n C-S-2 select-window -t 2
bind -n C-S-3 select-window -t 3
bind -n C-S-4 select-window -t 4
bind -n C-S-5 select-window -t 5
bind -n C-S-6 select-window -t 6

# FZF Session Picker
bind s display-popup -E "session=\$(tmux list-sessions -F \"#{session_name}\" | fzf --reverse); [ -n \"\$session\" ] && tmux switch-client -t \"\$session\""

########## WAYLAND CLIPBOARD ##########
# Use 'v' to begin selection, and 'y' to yank to Wayland clipboard
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"

########## STATUS BAR (Catppuccin Mocha) ##########
set -g status-position top
set -g status-interval 2
set -g status-justify centre
set -g status-style "bg=default,fg=#cdd6f4"

# Create a y-margin by using a transparent second status line
set -g status 2
set -g status-format[1] '#[bg=default]'

# Rounded powerline caps: left half-circle (U+E0B6) / right half-circle (U+E0B4)
set -g @sep_left ""
set -g @sep_right ""

set -g status-left-length 40
set -g status-left " #[fg=#cba6f7]#{@sep_left}#[bg=#cba6f7,fg=#1e1e2e]   #S #[bg=default,fg=#cba6f7]#{@sep_right}"

setw -g window-status-format "#[fg=#45475a] #{@sep_left}#[bg=#45475a,fg=#a6adc8] #I:#W #[bg=default,fg=#45475a]#{@sep_right} "
setw -g window-status-current-format "#[fg=#a6e3a1] #{@sep_left}#[bg=#a6e3a1,fg=#1e1e2e] #I:#W #[bg=default,fg=#a6e3a1]#{@sep_right} "

set -g status-right-length 60
set -g status-right "#[fg=#f9e2af]#{@sep_left}#[bg=#f9e2af] #( ~/.tmux/scripts/docker_status.sh ) #[bg=default,fg=#f9e2af]#{@sep_right} #[fg=#fab387]#{@sep_left}#[bg=#fab387,fg=#1e1e2e] %A %B %d #[bg=default,fg=#fab387]#{@sep_right} #[fg=#89b4fa]#{@sep_left}#[bg=#89b4fa,fg=#1e1e2e] %I:%M %p #[bg=default,fg=#89b4fa]#{@sep_right}  "

########## PLUGINS ##########
# Pinned explicitly rather than left to TPM's own default-detection: TPM's
# bootstrap script (set_default_tpm_path in its own `tpm` executable) checks
# whether ~/.config/tmux/tmux.conf exists and, if so, silently redirects
# TMUX_PLUGIN_MANAGER_PATH to ~/.config/tmux/plugins/ instead of the classic
# ~/.tmux/plugins/ -- which is exactly where this tmux.conf lives (XDG-style
# stow layout). install.sh clones TPM itself to ~/.tmux/plugins/tpm and
# never knew about this redirect, so the actual managed plugins
# (tmux-resurrect, tmux-continuum, even a second copy of tpm from the
# @plugin line below) were quietly living inside ~/.config/tmux/plugins/ --
# i.e. inside this git repo itself via the stow symlink, untracked, with
# their own nested .git dirs. Found auditing the repo for redundant/
# uncoordinated config. Setting this explicitly (before `run` below) stops
# TPM's own redirect from ever kicking in, keeping all plugin management in
# one place that matches install.sh's actual clone target.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-boot 'off'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-capture-pane-contents 'on'

########## INITIALIZE ##########
run '~/.tmux/plugins/tpm/tpm'

########## GENERAL ##########
set -g mouse on
set -g history-limit 200000          # Bigger buffer for long logs
set -g default-terminal "tmux-256color"

# WAYLAND & KITTY SPECIFIC: Modern terminal overrides (fix colors)
set-option -sa terminal-overrides ",xterm-kitty:Tc"

set -g status-keys vi
setw -g mode-keys vi

# CRITICAL FOR NEOVIM: Zero delay for escape key press
set -sg escape-time 0

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

########## PREFIX ##########
unbind C-b
set -g prefix C-a
bind C-a send-prefix

########## SPLITS ##########
# Open splits in the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind r source-file ~/.tmux.conf \; display "Reloaded!"

########## NAVIGATION ##########
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

bind -n M-S-Left resize-pane -L 5
bind -n M-S-Right resize-pane -R 5
bind -n M-S-Up resize-pane -U 2
bind -n M-S-Down resize-pane -D 2

bind -n C-S-1 select-window -t 1
bind -n C-S-2 select-window -t 2
bind -n C-S-3 select-window -t 3
bind -n C-S-4 select-window -t 4
bind -n C-S-5 select-window -t 5
bind -n C-S-6 select-window -t 6

# FZF Session Picker
bind s display-popup -E "session=\$(tmux list-sessions -F \"#{session_name}\" | fzf --reverse); [ -n \"\$session\" ] && tmux switch-client -t \"\$session\""

########## WAYLAND CLIPBOARD ##########
# Use 'v' to begin selection, and 'y' to yank to Wayland clipboard
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"

########## STATUS BAR ##########
set -g status-position top
set -g status-interval 2
set -g status-justify centre
set -g status-style "bg=default,fg=#c0c0c0"

# Create a y-margin by using a transparent second status line
set -g status 2
set -g status-format[1] '#[bg=default]'

set -g @sep_left ""
set -g @sep_right ""

set -g status-left-length 40
set -g status-left "  #[fg=#61AFEF]#{@sep_left}#[bg=#61AFEF,fg=#1E2127]   #S #[bg=default,fg=#61AFEF]#{@sep_right}"

setw -g window-status-format "#[fg=#5C6370] #{@sep_left}#[bg=#3B4048,fg=#ABB2BF] #I:#W #[bg=default,fg=#3B4048]#{@sep_right} "
setw -g window-status-current-format "#[fg=#98C379] #{@sep_left}#[bg=#98C379,fg=#1E2127] #I:#W #[bg=default,fg=#98C379]#{@sep_right} "

set -g status-right "#[fg=#89dceb] #( ~/.tmux/scripts/docker_status.sh )  #[fg=#fab387] %a, %b %d #[fg=#89b4fa] %I:%M %p  "

########## PLUGINS ##########
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-boot 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-capture-pane-contents 'on'

########## INITIALIZE ##########
run '~/.tmux/plugins/tpm/tpm'

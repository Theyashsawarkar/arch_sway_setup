# Wi-Fi picker for waybar's network module (see ARCHITECTURE.md). Replaces
# the old nwg-bar wifi.json popup (On/Off/Settings buttons only, no scan
# list -- nwg-bar can't do dynamic content, it's a static JSON button grid).
# This gives scan + connect + password prompt + on/off toggle in one menu.
#
# https://github.com/firecat53/networkmanager-dmenu -- confirmed native
# wofi support in the tool's own source (auto-applies wofi's -P
# password-mask flag for the passphrase prompt, no manual wiring needed).

[dmenu]
dmenu_command = wofi
active_chars = ==
# Wofi-native highlight instead of active_chars, for the currently
# connected network -- matches the rest of the bar's Mauve accent.
highlight = True
highlight_fg = #CBA6F7
highlight_bg = #313244
highlight_bold = True
compact = False
wifi_chars = ▂▄▆█
wifi_icons = 󰤯󰤟󰤢󰤥󰤨
# Icon-only, no visible signal%/bars/security text -- keeps the list
# compact (just the network name), the icon alone carries strength.
# wofi's dmenu list has no per-item hover tooltip support (checked:
# no such feature in wofi at all), so there's no "see full detail on
# hover" available here -- this is the actual tradeoff, not a partial
# implementation of that ask.
format = {icon}  {name}
list_saved = False
prompt = Wi-Fi Networks

[dmenu_passphrase]
# obscure is for the dmenu/bemenu/rofi masking fallback -- wofi uses its
# own native -P flag instead (applied automatically by the tool), so this
# doesn't apply here, left at the documented default.
obscure = False

[pinentry]
description = Get network password
prompt = Password:

[editor]
terminal = kitty
gui_if_available = True
gui = nm-connection-editor

[nmdm]
rescan_delay = 5
notification_timeout = 5
show_notifications = True

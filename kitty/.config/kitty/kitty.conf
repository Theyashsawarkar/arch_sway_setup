# Fonts
font_family      ZedMono Nerd Font
font_size        15
bold_font        auto
italic_font      auto
bold_italic_font auto

# Window Layout (Sway Minimalist)
hide_window_decorations yes
window_border_width 0
draw_minimal_borders yes
hide_tab_bar_if_only_one_tab yes
background_opacity 0.85

startup_mode normal

# Keybinds
map ctrl+shift+f toggle_fullscreen

# Inner window margins (Top Right Bottom Left)
window_padding_width 10 15 0 15
